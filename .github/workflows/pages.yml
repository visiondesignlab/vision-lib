name: Publish Vision Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
      - name: Run backend and export regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/playground_contract.mjs
      - name: Check desktop and mobile routes in Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/browser_routes.py
          python tests/browser_playground.py
      - name: Build public site
        env:
          VISION_INTAKE_URL: ${{ vars.VISION_INTAKE_URL }}
        run: python scripts/build_pages.py --base-path /vision-lib
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    timeout-minutes: 35
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # File synchronization can exceed the action's default 10 minutes.
          timeout: 1800000
  notify:
    name: Notify Feishu group
    if: ${{ always() }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Send commit summary and Pages result
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_IDS: ${{ secrets.FEISHU_CHAT_IDS }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGES_URL: https://visiondesignlab.github.io/vision-lib/
        run: python scripts/notify_feishu.py
