name: Publish Vision Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
      - name: Run backend and export regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check desktop and mobile routes in Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/browser_routes.py
      - name: Build public site
        run: python scripts/build_pages.py --base-path /vision-lib
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
